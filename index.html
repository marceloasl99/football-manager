            <td><strong>${p.name}</strong>${p.foreign?' *':''} <span class="muted small">${p.age}a</span></td>
            <td class="rating ${ratingClass(p.rating)}">${p.rating}</td>
            <td class="mono">${fmtMoney(p.value)}</td>
            <td>
              <div class="offer-wrap" onclick="event.stopPropagation()">
                <button class="btn sm" onclick="adjustInput('sell_${p.id}', -${step})">-</button>
                <input class="offer-input" type="number" id="sell_${p.id}" value="${p.value}">
                <button class="btn sm" onclick="adjustInput('sell_${p.id}', ${step})">+</button>
              </div>
            </td>
            <td><div class="flex-row" style="gap:4px;flex-wrap:nowrap">
              <button class="btn sm danger" onclick="event.stopPropagation();doSell('${p.id}')">Vender</button>
              <button class="btn sm" onclick="event.stopPropagation();doRelease('${p.id}')" title="Dispensar">✂</button>
            </div></td>
          </tr>`;
        }).join("")}
      </table>
    </div>
  </div>`;

  return tabs + (transferSection === 0 ? buyCard : sellCard);
}
function doBuy(id, club){
  const inp = document.getElementById("offer_"+id);
  const offer = parseInt(inp && inp.value, 10) || 0;
  const r = buyPlayer(id, club, offer);
  showMsg(r.msg, r.ok ? "info" : "error");
  if(r.ok){ transferList = transferList.filter(x => x.id !== id); saveGame(); }
  render();
}
function doSell(id){
  const inp = document.getElementById("sell_"+id);
  const ask = parseInt(inp && inp.value, 10) || 0;
  const r = sellPlayer(id, ask);
  showMsg(r.msg, r.ok ? "info" : "error");
  if(r.ok) saveGame();
  render();
}
function doSign(id){
  const r = signFreeAgent(id);
  showMsg(r.msg, r.ok ? "info" : "error");
  if(r.ok) saveGame();
  render();
}
function doRelease(id){
  const p = G.teams[G.teamName].squad.find(x => x.id === id);
  if(!p) return;
  openConfirmModal("✂ Dispensar Jogador", `Deseja rescindir o contrato de <strong>${p.name}</strong>? Multa rescisória: <strong class="warn">${fmtMoney(p.wage * 6)}</strong>.`, () => {
    const r = releasePlayer(id);
    showMsg(r.msg, r.ok ? "info" : "error");
    if(r.ok) saveGame();
    render();
  });
}
function renderStandings(){

function renderStats(){
  const pt = G.teams[G.teamName];
  const clubs = statsScope === "div" ? G.divisions[pt.division].map(n => G.teams[n]) : Object.values(G.teams);
  const key = statsTab === "goals" ? "goals" : statsTab === "assists" ? "assists" : "cg";
  const all = [];
  clubs.forEach(t => t.squad.forEach(p => { if((p[key] || 0) > 0) all.push({ ...p, club: t.name }); }));
  const sorted = all.sort((a,b) => (b[key]||0) - (a[key]||0) || (b.goals||0) - (a.goals||0) || (b.assists||0) - (a.assists||0)).slice(0,20);
  const title = statsTab === "goals" ? "Artilharia" : statsTab === "assists" ? "Assistências" : "Artilharia das Copas";
  const scopeLabel = statsTab === "cup" ? "Copa do Brasil & Continental" : (statsScope === "div" ? DIVISIONS[pt.division] : "Todas as divisões");

  return `<div class="card active-pane">
    <h3><span>📊 ${title} — ${scopeLabel}</span></h3>
    <div class="flex-row mb">
      <button class="btn ${statsTab==='goals'?'primary':''}" onclick="statsTab='goals';render()">⚽ Artilheiros</button>
      <button class="btn ${statsTab==='assists'?'primary':''}" onclick="statsTab='assists';render()">🎯 Garçons</button>
      <button class="btn cup ${statsTab==='cup'?'primary':''}" onclick="statsTab='cup';render()">🏆 Copas</button>
    </div>
    <div class="flex-row mb small">
      <span class="muted">Escopo:</span>
      <button class="btn sm ${statsScope==='div'?'primary':''}" onclick="statsScope='div';render()">Minha divisão</button>
      <button class="btn sm ${statsScope==='all'?'primary':''}" onclick="statsScope='all';render()">Todas</button>
    </div>

    ${sorted.length ? sorted.map((p, i) => {
      const rankClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      return `<div class="leaderboard-row">
        <div class="leaderboard-rank ${rankClass}">${i+1}</div>
        <div style="flex:1">
          <div><strong>${p.name}</strong> ${p.club === G.teamName ? '<span class="success">★</span>' : ''}</div>
          <div class="small muted">${p.club} · ${p.pos} · ${p.rating}${statsTab!=='cup' ? ` · ${p.apps||0} jogos` : ''}</div>
        </div>
        <div class="mono" style="font-size:1.2rem;font-weight:800;color:var(--accent)">${p[key]}</div>
      </div>`;
    }).join("") : '<p class="muted">Nada registrado ainda. Jogue algumas rodadas!</p>'}
  </div>`;
}

function renderFinances(){
  const pt = G.teams[G.teamName];
  const est = estimateMatchRevenue(pt, { randomize: false });
  const sf = G.seasonFinances || { gate:0, vip:0, matchday:0, socio:0, prizes:0, wages:0, upkeep:0, transfersIn:0, transfersOut:0 };
  const totalIn = sf.gate + sf.vip + sf.matchday + sf.socio + sf.prizes + sf.transfersIn;
  const totalOut = sf.wages + sf.upkeep + sf.transfersOut;
  const seasonBal = totalIn - totalOut;

  // Remaining home & away matches in season
  let remHome = 0, remAway = 0;
  for(let w = G.week - 1; w < WEEKS_PER_SEASON; w++){
    const row = (G.fixtures || [])[w] || [];
    const m = row.find(x => x.home === G.teamName || x.away === G.teamName);
    if(m){ if(m.home === G.teamName) remHome++; else remAway++; }
  }
  const projectedEndMoney = pt.money + (remHome * est.netHomeWeek) + (remAway * est.netAwayWeek);

  return `
  <div class="card active-pane">
    <h3>
      <span>🏦 Departamento Financeiro & Projeção de Caixa</span>
      <div class="flex-row">
        <button class="btn sm primary" onclick="stadiumTab='estimator';setView('stadium')">🧮 Simulador de Renda & Ingressos</button>
        <button class="btn sm" onclick="compTab='list';setView('cup')">💰 Ver Premiações</button>
      </div>
    </h3>
    <div class="grid-4 mt mb">
      <div class="kpi-box">
        <span class="kpi-label">Saldo Atual em Caixa</span>
        <span class="kpi-val warn">${fmtMoney(pt.money)}</span>
        <span class="kpi-sub">Disponível para obras e mercado</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">Renda Líquida (Jogo em Casa)</span>
        <span class="kpi-val ${est.netHomeWeek>=0?'success':'error'}">${est.netHomeWeek>=0?'+':''}${fmtMoney(est.netHomeWeek)}</span>
        <span class="kpi-sub">Público est.: ${est.attendance.toLocaleString()} (${est.occPct}%)</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">Balanço (Jogo Fora)</span>
        <span class="kpi-val ${est.netAwayWeek>=0?'success':'error'}">${est.netAwayWeek>=0?'+':''}${fmtMoney(est.netAwayWeek)}</span>
        <span class="kpi-sub">Sócios (${est.socios.toLocaleString()}) - Custos</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">Projeção Fim do Ano</span>
        <span class="kpi-val ${projectedEndMoney>=0?'success':'error'}">${fmtMoney(projectedEndMoney)}</span>
        <span class="kpi-sub">Restam ${remHome}J casa e ${remAway}J fora</span>
      </div>
    </div>

    <div class="grid-2">
      <div class="card" style="margin-bottom:0">
        <h3>📈 Receitas por Rodada (Estimativa Atual)</h3>
        <table>
          <tr><td>🎟️ Bilheteria (Ingresso a R$ ${est.ticketPrice})</td><td class="mono success" style="text-align:right">+${fmtMoney(est.gateIncome)} <span class="muted small">(em casa)</span></td></tr>
          <tr><td>🥂 Camarotes VIP & Hospitalidade (${pt.vipBoxes||10}%)</td><td class="mono success" style="text-align:right">+${fmtMoney(est.vipIncome)} <span class="muted small">(em casa)</span></td></tr>
          <tr><td>🛍️ Bares, Alimentação & Loja (${pt.facilities||15}%)</td><td class="mono success" style="text-align:right">+${fmtMoney(est.matchdayIncome)} <span class="muted small">(em casa)</span></td></tr>
          <tr><td>💳 Sócio-Torcedor (${est.socios.toLocaleString()}) & Patrocínio</td><td class="mono success" style="text-align:right">+${fmtMoney(est.socioIncome)} <span class="muted small">(toda rodada)</span></td></tr>
          <tr style="border-top:2px solid var(--border)"><td><strong>Total Bruto (Jogo em Casa)</strong></td><td class="mono font-bold success" style="text-align:right">+${fmtMoney(est.homeMatchTotal + est.socioIncome)}</td></tr>
        </table>
      </div>

      <div class="card" style="margin-bottom:0">
        <h3>📉 Despesas Fixas & Acumulado na Temporada ${G.season}</h3>
        <table>
          <tr><td>👥 Folha Salarial (${pt.squad.length} atletas)</td><td class="mono error" style="text-align:right">-${fmtMoney(est.wages)}/rodada</td></tr>
          <tr><td>🏟️ Manutenção do Estádio, CT & Base</td><td class="mono error" style="text-align:right">-${fmtMoney(est.upkeep)}/rodada</td></tr>
          <tr><td>🏆 Premiações Recebidas na Temp. ${G.season}</td><td class="mono warn" style="text-align:right">+${fmtMoney(sf.prizes)}</td></tr>
          <tr><td>🔄 Saldo de Transferências (Vendas - Compras)</td><td class="mono ${(sf.transfersIn-sf.transfersOut)>=0?'success':'error'}" style="text-align:right">${(sf.transfersIn-sf.transfersOut)>=0?'+':''}${fmtMoney(sf.transfersIn - sf.transfersOut)}</td></tr>
          <tr style="border-top:2px solid var(--border)"><td><strong>Balanço Operacional da Temporada</strong></td><td class="mono font-bold ${seasonBal>=0?'success':'error'}" style="text-align:right">${seasonBal>=0?'+':''}${fmtMoney(seasonBal)}</td></tr>
        </table>
      </div>
    </div>
  </div>`;
}

function renderStadiumSVG(pt, est){
  const cap = pt.stadium || 6500;
  const occ = est.occPct || 50;
  const pitchCol = pt.pitch >= 80 ? "#1b5e20" : pt.pitch >= 55 ? "#2e7d32" : "#558b2f";
  const standFill = occ >= 80 ? "#00e676" : occ >= 55 ? "#29b6f6" : "#546e7a";
  const vipGlow = (pt.vipBoxes || 10) >= 50 ? "#ffca28" : "#37474f";
  const hasRoof = (pt.lighting || 15) >= 60;
  return `
  <div class="stadium-Arena-wrap mb">
    <svg viewBox="0 0 360 200" style="width:100%;max-width:440px;height:auto">
      <!-- Anel Externo / Cobertura -->
      <rect x="14" y="10" width="332" height="180" rx="34" fill="#0d1720" stroke="${hasRoof ? '#29b6f6' : '#223544'}" stroke-width="${hasRoof ? '3' : '2'}"/>
      <!-- Arquibancadas Norte / Sul / Leste / Oeste -->
      <rect x="64" y="18" width="232" height="22" rx="6" fill="#162430" stroke="#263b4d"/>
      <rect x="64" y="18" width="${Math.round(232 * occ / 100)}" height="22" rx="6" fill="${standFill}" opacity="0.55"/>
      <rect x="64" y="160" width="232" height="22" rx="6" fill="#162430" stroke="#263b4d"/>
      <rect x="64" y="160" width="${Math.round(232 * occ / 100)}" height="22" rx="6" fill="${standFill}" opacity="0.55"/>
      <rect x="24" y="44" width="26" height="112" rx="6" fill="#162430" stroke="#263b4d"/>
      <rect x="24" y="${44 + Math.round(112 * (1 - occ/100))}" width="26" height="${Math.round(112 * occ / 100)}" rx="6" fill="${standFill}" opacity="0.55"/>
      <rect x="310" y="44" width="26" height="112" rx="6" fill="#162430" stroke="#263b4d"/>
      <rect x="310" y="${44 + Math.round(112 * (1 - occ/100))}" width="26" height="${Math.round(112 * occ / 100)}" rx="6" fill="${standFill}" opacity="0.55"/>
      <!-- Camarotes VIP -->
      <rect x="110" y="41" width="140" height="6" rx="3" fill="${vipGlow}"/>
      <rect x="110" y="153" width="140" height="6" rx="3" fill="${vipGlow}"/>
      <!-- Gramado -->
      <rect x="60" y="50" width="240" height="100" rx="4" fill="${pitchCol}" stroke="#a5d6a7" stroke-width="1.5"/>
      <line x1="180" y1="50" x2="180" y2="150" stroke="#a5d6a7" stroke-width="1.2"/>
      <circle cx="180" cy="100" r="18" fill="none" stroke="#a5d6a7" stroke-width="1.2"/>
      <rect x="60" y="75" width="26" height="50" fill="none" stroke="#a5d6a7" stroke-width="1.2"/>
      <rect x="274" y="75" width="26" height="50" fill="none" stroke="#a5d6a7" stroke-width="1.2"/>
      <!-- Refletores LED -->
      <circle cx="34" cy="24" r="6" fill="#fff59d" opacity="${0.35 + (pt.lighting||15)/160}"/>
      <circle cx="326" cy="24" r="6" fill="#fff59d" opacity="${0.35 + (pt.lighting||15)/160}"/>
      <circle cx="34" cy="176" r="6" fill="#fff59d" opacity="${0.35 + (pt.lighting||15)/160}"/>
      <circle cx="326" cy="176" r="6" fill="#fff59d" opacity="${0.35 + (pt.lighting||15)/160}"/>
    </svg>
    <div class="small muted text-center" style="margin-top:6px">
      Lotação Projetada: <strong style="color:var(--accent)">${est.attendance.toLocaleString()} / ${cap.toLocaleString()} (${occ}%)</strong>
      ${est.crowdBonusPct > 0 ? ` · <span class="success font-bold">🔥 Caldeirão Ativo (+${est.crowdBonusPct}% força em casa)</span>` : ''}
    </div>
  </div>`;
}

            <div class="flex-row mt mb-2">
              <button class="btn sm" onclick="setTicketPrice((G.teams[G.teamName].ticketPrice||20)-5)">- R$ 5</button>

              <span class="muted">Perfis rápidos:</span>
              <button class="btn sm" onclick="applyTicketPreset('popular')">🔥 Popular (Lotar)</button>
              <button class="btn sm" onclick="applyTicketPreset('balanced')">⚖ Equilibrado</button>
              <button class="btn sm gold" onclick="applyTicketPreset('optimal')">💰 Receita Máxima (R$ ${optPrice})</button>
              <button class="btn sm" onclick="applyTicketPreset('premium')">💎 Jogo Grande</button>
            </div>
          </div>

          <div class="card" style="background:#0a1218;margin-bottom:0">
            <label class="mb-1">📊 Cenário da Partida Simulada:</label>
            <div class="flex-row">
              <button class="btn sm ${stadiumSimScenario==='normal'?'primary':''}" onclick="stadiumSimScenario='normal';render()">Jogo Comum</button>
              <button class="btn sm ${stadiumSimScenario==='rival'?'primary':''}" onclick="stadiumSimScenario='rival';render()">Clássico / G-4</button>
              <button class="btn sm ${stadiumSimScenario==='cup'?'cup':''}" onclick="stadiumSimScenario='cup';render()">Mata-Mata Copa</button>
              <button class="btn sm ${stadiumSimScenario==='final'?'gold':''}" onclick="stadiumSimScenario='final';render()">Decisão / Final</button>

      <div class="grid-4 mt">

        <div class="kpi-box">
          <span class="kpi-label">Renda Matchday (Casa)</span>

          <span class="kpi-sub">Bilheteria + VIP + Bares/Loja</span>
        </div>
        <div class="kpi-box">
          <span class="kpi-label">Sócio-Torcedor & Naming</span>
          <span class="kpi-val info">+${fmtMoney(est.socioIncome)}/rod</span>
          <span class="kpi-sub">${est.socios.toLocaleString()} sócios ativos</span>

        <div class="kpi-box">
          <span class="kpi-label">Lucro Líquido (Casa)</span>

            <tr><td>Receita Bruta Estimada nos ${remHome} Jogos em Casa</td><td class="mono success" style="text-align:right">+${fmtMoney(projHomeGross)}</td></tr>

        <span>📋 Histórico de Borderôs & Recordes — ${stName}</span>

  const statValues = {

function getCoachRank(pts){
  if(pts >= 2200) return { title: "👑 Lenda Imortal do Futebol Brasileiro", badge: "a" };
  if(pts >= 1200) return { title: "🌟 Mestre Tático Consagrado", badge: "cup" };
  if(pts >= 600)  return { title: "🏆 Treinador de Elite Nacional", badge: "b" };
  if(pts >= 200)  return { title: "📈 Técnico Promissor", badge: "c" };
  return { title: "📋 Treinador em Início de Carreira", badge: "d" };
}

function doPlayWeek(){
  if(!G) return;
  if(G.phase === "sacked"){
    showMsg("💼 Você foi demitido — escolha uma proposta na tela inicial.", "error");
    setView("home");
    return;
  }
  if(autoPlayActive) stopAutoPlay();

  const pt = G.teams[G.teamName];
  if(G.week <= WEEKS_PER_SEASON){
    G.selected = G.selected.filter(id => {
      const p = pt.squad.find(x => x.id === id);
      return p && p.injured <= 0 && p.suspended <= 0;
    });
    if(G.selected.length < 11){
      showMsg("⚠️ Selecione 11 titulares (ou aperte Auto XI)!", "error");
      setView("tactics");
      return;
    }
    const xi = playerXI();
    const foreigners = xi.filter(p => p.foreign).length;
    if(foreigners > MAX_FOREIGNERS){
      showMsg(`⚠️ Máximo de ${MAX_FOREIGNERS} estrangeiros!`, "error");
      setView("tactics");
      return;
    }
    if(!xi.some(p => p.pos === "GK") && getAvailableSquad().some(p => p.pos === "GK")){
      showMsg("⚠️ Escale um goleiro!", "error");
      setView("tactics");
      return;
    }
  }
  const result = playWeek();
  if(result && result.endSeason){
    lastMatch = null;
    currentView = "home";
  } else if(result){
    lastMatch = result;
    currentView = "home";
    saveGame();
  }
  transferList = [];
  render();
}

function nextOpponentInfo(){
  const nextFix = G.fixtures[G.week-1];
  if(!nextFix) return null;
  const f = nextFix.find(x => x.home === G.teamName || x.away === G.teamName);
  if(!f) return null;
  const home = f.home === G.teamName;
  const opp = home ? f.away : f.home;
  return { opp, home, oppStr: Math.round(squadStrength(G.teams[opp].squad)) };

function tryLoad(){
  const infos = [0,1,2].map(slotInfo).filter(Boolean);
  if(infos.length === 0){
    openModal("Nenhum Jogo Salvo", "Nenhum save compatível foi encontrado. Toque em 'Nova Carreira' para começar!");
    return;
  }
  if(infos.length === 1){ loadSlotAndGo(infos[0].slot); return; }
  openSavesModal();
}
function loadSlotAndGo(i){
  if(loadGame(i)){
    closeModal();
    currentView = "home";
    lastMatch = null;
    transferList = [];
    showMsg("📂 Carreira carregada!");
    render();
  } else {
    showMsg("Não foi possível carregar este save.", "error");

function openSavesModal(){
  const rows = [0,1,2].map(i => {
    const s = slotInfo(i);
    if(!s) return `<div class="slot-row"><div><strong>Slot ${i+1}</strong><div class="small muted">Vazio</div></div></div>`;
    const when = s.savedAt ? new Date(s.savedAt).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "—";
    return `<div class="slot-row">
      <div><strong>Slot ${i+1} — ${s.team}</strong>${s.sacked ? ' 💼' : ''}
        <div class="small muted">${DIVISIONS[s.div]} · Temp ${s.season} · Rodada ${Math.min(s.week, WEEKS_PER_SEASON)} · ${when}</div></div>

        <button class="btn sm primary" onclick="loadSlotAndGo(${i})">Abrir</button>
        <button class="btn sm" onclick="exportSlot(${i})" aria-label="Exportar">⬇</button>

     <div class="flex-row mt"><button class="btn sm gold" onclick="document.getElementById('importFile').click()">⬆ Importar arquivo</button></div>

  const s = slotInfo(i);
  if(!s) return;
  openConfirmModal("🗑 Excluir Save", `Excluir o <strong>Slot ${i+1} (${s.team})</strong>? Essa ação não pode ser desfeita.`, () => {
    deleteSlot(i);
    openSavesModal();
  });
}
function downloadText(filename, text){
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportSlot(i){
  const raw = localStorage.getItem(slotKey(i));
  const s = slotInfo(i);
  if(!raw || !s){ showMsg("Slot vazio.", "error"); return; }
  downloadText(`astrum-fm-${s.team.replace(/[^A-Za-z0-9]+/g, "-")}-T${s.season}.json`, raw);
  showMsg("⬇ Save exportado!");
}
function importSaveFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let ok = false;
    try { ok = adoptSave(JSON.parse(r.result)); } catch(e){ ok = false; }
    if(ok){
      closeModal();
      currentView = "home"; lastMatch = null; transferList = [];
      showMsg("⬆ Save importado!");
      render();
    } else {
      showMsg("Arquivo de save inválido ou incompatível.", "error");
    }
  };
  r.readAsText(file);
}

function executeStartNew(name, difficulty, kit1, kit2, slot){
  newGame({ name, difficulty, kit1, kit2, slot });
  currentView = "home";
  lastMatch = null;
  transferList = [];
  render();
}
function startNew(){
  const inp = document.getElementById("teamName");
  const name = sanitizeClubName(inp ? inp.value : "Juventus-SP");
  const diffEl = document.getElementById("diff");
  const difficulty = diffEl ? diffEl.value : "normal";
  const slotEl = document.getElementById("slotSel");
  const slot = slotEl ? parseInt(slotEl.value, 10) || 0 : 0;
  const kit1El = document.getElementById("kit1");
  const kit2El = document.getElementById("kit2");
  const kit1 = kit1El ? kit1El.value : "#00e676";
  const kit2 = kit2El ? kit2El.value : "#ffca28";
  const existing = slotInfo(slot);
  if(existing){
    openConfirmModal("💾 Sobrescrever Slot", `O <strong>Slot ${slot+1}</strong> já possui uma carreira salva (<strong>${existing.team}</strong>, Temp ${existing.season}). Deseja sobrescrever?`, () => {
      executeStartNew(name, difficulty, kit1, kit2, slot);
    });
    return;
  }
  executeStartNew(name, difficulty, kit1, kit2, slot);
}
// --------------- BOTTOM BAR ---------------

  if(activeModal){
    bottomBar.innerHTML = `
      <div class="kb-legend"><div class="kb-item"><span class="kb-key">Enter</span> / <span class="kb-key">Esc</span> Fechar</div></div>

  }
  if(currentView === "title"){
    bottomBar.innerHTML = `
      <div class="kb-legend">
        <div class="kb-item"><span class="kb-key">↑</span><span class="kb-key">↓</span> Menu</div>
        <div class="kb-item"><span class="kb-key">Enter</span> Selecionar</div>

      </div>
      <div class="mobile-Controls">
        <button class="btn primary" onclick="currentView='newgame';render()">▶ Novo</button>
        <button class="btn" onclick="tryLoad()">📂 Abrir</button>
        <button class="btn" onclick="toggleFullScreen()">⛶</button>
      </div>`;

  }
  if(currentView === "newgame"){
    bottomBar.innerHTML = `
      <div class="kb-legend">
        <div class="kb-item"><span class="kb-key">Enter</span> Iniciar</div>
        <div class="kb-item"><span class="kb-key">Esc</span> Voltar</div>
      </div>
      <div class="mobile-Controls">
        <button class="btn" onclick="currentView='title';render()">← Voltar</button>
        <button class="btn primary" onclick="startNew()">▶ Começar</button>
        <button class="btn" onclick="toggleFullScreen()">⛶</button>
      </div>`;

  bottomBar.innerHTML = `
    <div class="kb-legend">
      <div class="kb-item"><span class="kb-key">1-0</span> / <span class="kb-key">←</span><span class="kb-key">→</span> Abas</div>
      <div class="kb-item"><span class="kb-key">↑</span><span class="kb-key">↓</span> Linha</div>
      <div class="kb-item"><span class="kb-key">Enter</span> Ação</div>
      <div class="kb-item"><span class="kb-key">P</span> Jogar</div>

      <div class="kb-item"><span class="kb-key">A</span> Auto XI</div>
      <div class="kb-item"><span class="kb-key">F</span> Full</div>
      <div class="kb-item"><span class="kb-key">S</span> Salvar</div>
    </div>
    <div class="mobile-Controls">
      <button class="btn primary" onclick="doPlayWeek()">${G && G.week > WEEKS_PER_SEASON ? '🏁 Fim' : '▶ Jogar'}</button>
      <button class="btn ${autoPlayActive?'danger':'gold'}" onclick="startAutoPlay(0)">${autoPlayActive?'⏹':'▶▶'}</button>
      <button class="btn" onclick="autoSelectXI();showMsg('⚡ Auto XI!');render()">⚡</button>
      <button class="btn" onclick="manualSave()">💾</button>

}

// --------------- KEYBOARD ---------------
window.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
  const isInput = (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA");

  if(activeModal){
    if(activeModal.raw && tag === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
    if(e.key === "Escape" || e.key === "Enter" || e.key === " "){ e.preventDefault(); closeModal(); }
    return;
  }

  if(!isInput && (e.key === "f" || e.key === "F")){
    e.preventDefault();
    toggleFullScreen();
    return;
  }

  if(currentView === "title"){
    const n = titleItems().length;
    if(e.key === "ArrowDown"){ e.preventDefault(); titleIndex = (titleIndex + 1) % n; renderTitle(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); titleIndex = (titleIndex + n - 1) % n; renderTitle(); }
    else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); runTitleAction(titleIndex); }
    return;
  }

  if(currentView === "newgame"){
    if(e.key === "Escape"){ e.preventDefault(); currentView = "title"; render(); }
    else if(e.key === "Enter"){ e.preventDefault(); startNew(); }
    return;
  }

  if(isInput){
    if(e.key === "Escape"){ e.target.blur(); return; }
    if(e.key === "Enter" && currentView === "transfers" && G && marketActive()){
      e.preventDefault();
      triggerTransferRowAction();
      return;
    }
    return;
  }

  if(!G) return;

  if(e.key === "Escape"){
    e.preventDefault();
    if(autoPlayActive){ stopAutoPlay("⏹ Parado."); return; }
    if(currentView !== "home"){ setView("home"); }
    else { currentView = "title"; render(); }
    return;
  }

  if(e.key === "m" || e.key === "M"){ e.preventDefault(); startAutoPlay(0); return; }

  // 1-9 + 0 for 10 tabs
  if(e.key >= "0" && e.key <= "9"){
    e.preventDefault();
    const idx = e.key === "0" ? 9 : parseInt(e.key,10) - 1;
    if(NAV_TABS[idx]) setView(NAV_TABS[idx]);
    return;
  }

  if(e.key === "ArrowRight"){
    e.preventDefault();
    const cur = NAV_TABS.indexOf(currentView);
    setView(NAV_TABS[(cur+1)%NAV_TABS.length]);
    return;
  }
  if(e.key === "ArrowLeft"){
    e.preventDefault();
    const cur = NAV_TABS.indexOf(currentView);
    setView(NAV_TABS[(cur-1+NAV_TABS.length)%NAV_TABS.length]);
    return;
  }

  if(e.key === "p" || e.key === "P"){ e.preventDefault(); doPlayWeek(); return; }
  if(e.key === "s" || e.key === "S"){ e.preventDefault(); manualSave(); return; }
  if(e.key === "a" || e.key === "A"){ e.preventDefault(); autoSelectXI(); showMsg("⚡ Auto XI!"); render(); return; }

  if(e.key === "Tab" && currentView === "transfers"){
    e.preventDefault(); transferSection = (transferSection + 1) % 3; rowIndex = 0; render(); return;
  }

  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    const maxRows = getMaxRowsForCurrentView();
    if(maxRows > 0){
      e.preventDefault();
      if(e.key === "ArrowDown") rowIndex = clamp(rowIndex + 1, 0, maxRows - 1);
      else rowIndex = clamp(rowIndex - 1, 0, maxRows - 1);
      render(true);
    }
    return;
  }

  if(e.key === "Enter" || e.key === " "){
    if(currentView === "tactics"){
      e.preventDefault();
      const avail = getAvailableSquad();
      const p = avail[rowIndex];
      if(p) toggleSelect(p.id);
    } else if(currentView === "stadium"){
      e.preventDefault();
      const u = STADIUM_UPGRADES[rowIndex];
      if(u) upgrade(u.key);
    } else if(currentView === "transfers" && marketActive()){
      e.preventDefault();
      triggerTransferRowAction();
    } else if(currentView === "squad"){
      e.preventDefault();
      setView("tactics");
    }
  }
});

function getMaxRowsForCurrentView(){
  if(!G) return 0;
  if(currentView === "squad") return getSortedPlayerSquad().length;
  if(currentView === "tactics") return getAvailableSquad().length;
  if(currentView === "standings") return TEAMS_PER_DIV;
  if(currentView === "stadium") return STADIUM_UPGRADES.length;
  if(currentView === "transfers"){
    if(transferSection === 2) return (G.freeAgents || []).filter(p => mktPos === "ALL" || p.pos === mktPos).length;
    if(!G.transferWeek) return 0;
    return transferSection === 0 ? filteredTransferList().length : getSortedPlayerSquad().length;
  }
  return 0;
}
function triggerTransferRowAction(){
  if(transferSection === 2){
    const list = (G.freeAgents || []).filter(p => mktPos === "ALL" || p.pos === mktPos).sort((a,b) => b.rating - a.rating);
    const p = list[rowIndex];
    if(p) doSign(p.id);
  } else if(transferSection === 0){
    const p = filteredTransferList()[rowIndex];
    if(p) doBuy(p.id, p.club);
  } else {
    const p = getSortedPlayerSquad()[rowIndex];
    if(p) doSell(p.id);
  }
}
// --------------- PWA / ciclo de vida ---------------
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if(currentView === 'title') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; });

document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && G) saveGame(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(nw) nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller) showMsg('🔄 Nova versão instalada — recarregue para atualizar.');
        });
      });
    }).catch(() => {});
  });
}

render();
</script>
